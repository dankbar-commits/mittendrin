services:
  backend:
    build:
      context: ./backend
    container_name: mittendrin-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      LOCAL_LLM_BASE_URL: "http://host.docker.internal:1234/v1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: mittendrin-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped